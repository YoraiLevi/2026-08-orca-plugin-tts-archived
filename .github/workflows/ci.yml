name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Cross-platform parity is a hard requirement (constitution principle III).
      # A feature that works on one OS and degrades on another is not done.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.24.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Linux runners have no speech synthesizer or audio sink preinstalled.
      # Installing them is what makes the OS-synth contract suite meaningful here rather than skipped.
      - name: Install Linux speech and audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng alsa-utils pulseaudio-utils xclip

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # PITFALLS P0: a claim about the plugin API is only as good as its `file:line`. Round-3 review
      # found ~30 citations that had gone stale by 15-150 lines while the code moved underneath them,
      # which is P0's failure mode with a friendly face -- the reader cannot tell a stale pointer
      # from a fabricated one. This step is what makes that drift loud. It runs on Linux only:
      # the check reads text, so three identical runs would tell us nothing three times.
      # The runner has no ORCA checkout, so the ~480 citations into ORCA's tree cannot be resolved
      # here; the script says so out loud rather than counting them as passing. To check those too,
      # run it locally with ORCA_SRC set (see docs/.research/citation-audit.md).
      #
      # --max-stale is a RATCHET, not an amnesty. 34 citations are still stale, all of them in
      # documents that were being written while the code moved underneath them; each one is listed
      # in docs/.research/citation-audit.md with why it is still open. Lower this number as they are
      # re-derived. It must never go up: raising it is how a checker becomes decoration.
      - name: Citations must still point at what the documents say they do
        if: runner.os == 'Linux'
        run: pnpm check:citations --max-stale=34

      # The gate that checks the GATES. `pnpm test` answers "did the suite pass?"; this answers the
      # question the constitution actually asks -- what result would have proved me wrong? It breaks
      # the implementation on purpose, one named edit at a time, and fails if the test meant to
      # catch that edit stays green. It exists because a 900 ms cancel -- an 18x regression on the
      # barge-in budget -- was green in all 180 tests, and because principle VIII's thinking-block
      # gate could be made to leak reasoning with every one of its own tests still passing
      # (docs/.research/test-audit.md).
      #
      # Linux only, and deliberately: it runs the suite once per mutant, so three identical runs
      # would cost three times as much to learn the same thing. The two platform-specific mutants
      # in the registry are the cancel pair, and those go through `OsSynthProvider` on whichever
      # synthesizer the runner has -- espeak-ng here, `say` on a developer's Mac.
      - name: Mutation check — every load-bearing test must be able to fail
        if: runner.os == 'Linux'
        run: pnpm check:mutants

      - name: Size gate (ORCA caps at 2000 files / 50 MB)
        run: pnpm size-gate

      - name: Artifact must be self-contained (no symlinks escape the plugin root)
        shell: bash
        run: |
          found=$(find dist/plugin -type l | wc -l)
          echo "symlinks in artifact: $found"
          test "$found" -eq 0

      - name: Smoke test — the bundle loads and exports activate
        run: node -e "import('./dist/plugin/main.mjs').then(m=>{if(typeof m.default!=='function'){console.error('activate missing');process.exit(1)}console.log('bundle ok')})"

      - name: Smoke test — the OS synthesizer produces real audio bytes
        run: node scripts/smoke-synth.mjs

      - name: Smoke test — activate() registers every command the manifest declares
        run: node scripts/smoke-activate.mjs

  # ------------------------------------------------------------------------------------------
  # M11 Voice Lab — the normalize side, on all three platforms, with the audio side proved ABSENT.
  #
  # A SEPARATE JOB FROM `test`, DELIBERATELY, AND IT INSTALLS NO SYNTHESIZER ON LINUX.
  # The `test` job above installs espeak-ng so the OS-synth contract suite is meaningful there.
  # This job must not: PITFALLS P25 says a stock Ubuntu desktop ships the espeak-ng LIBRARY and
  # not the espeak-ng COMMAND, which is the rung most Linux users actually land on. Installing a
  # synthesizer here would buy a green tick on a machine no user has, and would delete the only
  # place we assert the CORRECT FAILURE — a 503 carrying the provider's own words and its install
  # remedy, or the named `spoke-elsewhere` outcome.
  #
  # NOTHING HERE OPENS AN AUDIO DEVICE OR SPAWNS A PLAYER (spec FR-006, FR-106; PITFALLS P31).
  # That is not asserted by grepping a log the server wrote about itself — `child_process` is
  # wrapped from outside the process under test, and the step below it proves the wrapper can go
  # red by spawning a real player in a scratch run.
  voice-lab:
    name: voice lab ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.24.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The gate that checks THIS gate. It spawns a real player (always on a file that does not
      # exist, so it exits before reaching the audio device — P32) and requires the audit to go
      # red; then requires it to stay GREEN on the five spawns the provider legitimately makes.
      # A guard nobody has seen fail is a guard nobody can trust, and a guard that reddens on
      # everything is just as useless. Run before the harness, so a broken guard fails loudly
      # rather than silently blessing the run after it.
      - name: The no-audio guard must be able to fail
        run: node scripts/ci/voice-lab-ci.mjs --prove-guard

      # normalize parity against the LIBRARY (never against the server's own output), the stage
      # ladder DERIVED from packages/core/src/normalizer/index.ts (never a hardcoded 15), the
      # source-not-dist proof plus its negative control, the 127.0.0.1-not-0.0.0.0 bind, the
      # platform's correct /speak outcome, and the no-audio verdict. Every probe CI cannot run is
      # reported by name with its reason and lands in the job summary (spec FR-107).
      - name: Voice Lab — headless assertions, and zero audio-device opens
        run: node scripts/ci/voice-lab-ci.mjs
